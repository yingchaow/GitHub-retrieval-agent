services:
  codebase-rag:
    build: .
    container_name: codebase-rag
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - rag_demo_data:/app/.rag_demo
    restart: unless-stopped

volumes:
  rag_demo_data:
